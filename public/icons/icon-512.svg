<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="goldGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado con bordes suaves -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient512)"/>
  
  <!-- Fichas de juego decorativas flotantes -->
  <circle cx="410" cy="110" r="36" fill="#10B981" opacity="0.45"/>
  <circle cx="95" cy="400" r="26" fill="#F43F5E" opacity="0.45"/>
  <circle cx="415" cy="390" r="22" fill="#F59E0B" opacity="0.4"/>

  <!-- Canasto / Bóveda estilizada -->
  <g transform="translate(96, 105)" filter="url(#shadow)">
    <!-- Base canasto -->
    <path d="M32 108 L288 108 L262 250 C256 272 240 288 218 288 L102 288 C80 288 64 272 58 250 Z" 
          fill="#5B21B6" stroke="#C4B5FD" stroke-width="10" stroke-linejoin="round"/>
    <!-- Asa del canasto -->
    <path d="M80 108 C80 38 240 38 240 108" 
          fill="none" stroke="#FDE047" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Moneda central flotante -->
    <circle cx="160" cy="132" r="74" fill="url(#goldGradient512)" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Símbolo monetario de Canasto Bank -->
    <text x="160" y="158" font-family="system-ui, sans-serif" font-weight="900" font-size="76" fill="#4C1D95" text-anchor="middle">₵</text>
  </g>
</svg>
